name: Deploy

# Auto-deploy je onemogućen — putanje /var/www/ders.ba/{web,server} koje je
# koristio ne postoje na produkciji. Kanonski deploy je ručni git pull na
# serveru, vidi CLAUDE.md. Ovaj workflow samo pokreće CI (lint/test/build).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
