server {
    listen 80;
    server_name ders.ba www.ders.ba;
    return 301 https://$host$request_uri;  # preusmjeri sav HTTP na HTTPS
}

server {
    listen 443 ssl http2;
    server_name ders.ba www.ders.ba;

    ssl_certificate /etc/letsencrypt/live/ders.ba/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ders.ba/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy za API (backend)
    location /api {
        proxy_pass http://localhost:5003;  # tvoj backend API na portu 5003
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statički fajlovi (uploads) - ako postoje van Next.js
    location /uploads/ {
        root /var/www;  # znači fajlovi su u /var/www/uploads/...
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy za Next.js frontend
    location / {
        proxy_pass http://localhost:3000;  # next.js server na portu 3000
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
} 