# Nginx konfiguracija za ders.ba sa CDN optimizacijom za slike
server {
    listen 80;
    listen [::]:80;
    server_name ders.ba www.ders.ba;
    
    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ders.ba www.ders.ba;
    
    # SSL konfiguracija
    ssl_certificate /etc/letsencrypt/live/ders.ba/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ders.ba/privkey.pem;
    
    # Next.js aplikacija
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Express server API
    location /api {
        proxy_pass http://localhost:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # CDN za slike - direktno serviranje sa diska (brže)
    location /cdn/images {
        alias /var/www/ders/server/cdn/images;
        
        # Browser cache - 30 dana za upload-e, 90 dana za defaults
        location ~* /cdn/images/uploads/.*\.(jpg|jpeg|png|gif|webp|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept";
        }
        
        location ~* /cdn/images/defaults/.*\.(jpg|jpeg|png|gif|webp|svg)$ {
            expires 90d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept";
        }
        
        # CORS headers za mobile app
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
        
        # Optimizacija
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # WebP podrška sa fallback
        location ~* ^/cdn/images/(.*)\.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            try_files $1.webp $uri =404;
        }
    }
    
    # Legacy uploads endpoint - redirect na CDN
    location /uploads {
        rewrite ^/uploads/images/(.*)$ /cdn/images/uploads/$1 permanent;
        rewrite ^/uploads/(.*)$ /cdn/images/defaults/$1 permanent;
    }
    
    # Gzip kompresija
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    
    # Dodatne performanse optimizacije za slike
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
}